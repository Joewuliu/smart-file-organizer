[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-file-organizer"
version = "0.1.0"
description = "A safe, dry-run-first command-line tool for organizing files by type."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
smart-organizer = "organizer.cli:main"

[tool.setuptools.packages.find]
include = ["organizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
