[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-file-organizer"
version = "0.1.0"
description = "A safe, dry-run-first command-line tool for organizing files by type."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
smart-organizer = "organizer.cli:main"

[tool.setuptools.packages.find]
include = ["organizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Conservative on purpose: pyflakes (unused imports, undefined names,
# obvious mistakes) plus pycodestyle's error-level checks. No style/
# modernization rule sets, so this won't demand a cosmetic rewrite.
select = ["E4", "E7", "E9", "F"]
